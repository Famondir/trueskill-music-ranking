version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # Mount data and config so changes don't require rebuilding the image
    volumes:
      - ./songdata:/app/songdata:ro
      - ./trueskill_tt:/app/trueskill_tt
      - ./config.yaml:/app/config.yaml:ro
    # Expose port only internally; the frontend nginx acts as reverse proxy
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
